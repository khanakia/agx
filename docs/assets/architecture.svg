<svg viewBox="0 0 880 710" width="880" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Light canvas so the diagram reads as a white card on GitHub's dark page. -->
  <rect x="0" y="0" width="880" height="710" fill="#ffffff"/>

  <text x="440" y="34" font-size="16" fill="#1e293b" text-anchor="middle">agx architecture</text>

  <!-- Layer bands: x=20..640 with the layer name inside at x=34, inner boxes x=155..625, 12px top/bottom padding,
       26px between bands.  -->
  <rect x="20" y="56" width="620" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="20" y="160" width="620" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="20" y="264" width="620" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="20" y="368" width="620" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="20" y="472" width="620" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <rect x="20" y="576" width="620" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <!-- Operations column: x=665..860, boxes x=680..845. -->
  <rect x="665" y="160" width="195" height="338" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="675" y="174" font-size="11" fill="#64748b">Operations · internal/cli</text>

  <!-- Layer names, left end of each band. -->
  <text x="34" y="92" font-size="12" fill="#1e293b">You</text>
  <text x="34" y="107" font-size="10" fill="#64748b">terminal</text>
  <text x="34" y="196" font-size="12" fill="#1e293b">CLI</text>
  <text x="34" y="211" font-size="10" fill="#64748b">internal/cli</text>
  <text x="34" y="300" font-size="12" fill="#1e293b">Libraries</text>
  <text x="34" y="315" font-size="10" fill="#64748b">config, login, pick</text>
  <text x="34" y="404" font-size="12" fill="#1e293b">Domain model</text>
  <text x="34" y="419" font-size="10" fill="#64748b">provider</text>
  <text x="34" y="508" font-size="12" fill="#1e293b">Vendors</text>
  <text x="34" y="523" font-size="10" fill="#64748b">provider/*</text>
  <text x="34" y="612" font-size="12" fill="#1e293b">Machine</text>
  <text x="34" y="627" font-size="10" fill="#64748b">CLIs, homes, APIs</text>

  <!-- Primary flow (blue, down). Every connector starts 5px off its source and ends 11px short
       of its target, because refX="2" puts the painted tip 6px past the path's end. -->
  <path d="M220,127 L 220,161" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M220,231 L 220,265" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M370,303 L 380,303" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M476,335 L 476,369" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M220,439 L 220,473" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M220,543 L 220,577" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Return flow (green, up): homes and endpoints feed the vendors, the vendors fill the
       domain model, render turns it into a table or JSON. The x=593 lane passes 32px right of
       the pick box. -->
  <path d="M593,583 L 593,549" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M370,583 L 370,549" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M370,479 L 370,445" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M593,479 L 593,445" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M593,375 L 593,237" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M593,167 L 593,133" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Connector labels, centred in the 50px gaps between boxes. -->
  <text x="232" y="151" font-size="10" fill="#1e40af">runs agx run -p work</text>
  <text x="581" y="151" font-size="10" fill="#166534" text-anchor="end">table or JSON</text>
  <text x="232" y="255" font-size="10" fill="#1e40af">flags + ~/.agx/config.yaml</text>
  <text x="464" y="359" font-size="10" fill="#1e40af" text-anchor="end">⑤ build command + env</text>
  <text x="232" y="463" font-size="10" fill="#1e40af">chosen provider</text>
  <text x="382" y="463" font-size="10" fill="#166534">Usage · Conversation</text>
  <text x="232" y="567" font-size="10" fill="#1e40af">provider.Command</text>
  <text x="382" y="567" font-size="10" fill="#166534">conversations</text>
  <text x="581" y="567" font-size="10" fill="#166534" text-anchor="end">usage windows</text>

  <!-- You -->
  <rect x="155" y="68" width="210" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="260" y="90.2" font-size="12" fill="#1e40af" text-anchor="middle">① shell alias</text>
  <text x="260" y="108.2" font-size="12" fill="#1e40af" text-anchor="middle">cl · clw · clnew · clr</text>
  <rect x="391" y="68" width="234" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="508" y="90.2" font-size="12" fill="#1e40af" text-anchor="middle">your terminal</text>
  <text x="508" y="108.2" font-size="12" fill="#1e40af" text-anchor="middle">usage table · conversation list</text>

  <!-- CLI -->
  <rect x="155" y="172" width="210" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="260" y="194.2" font-size="12" fill="#b45309" text-anchor="middle">② agx command</text>
  <text x="260" y="212.2" font-size="12" fill="#b45309" text-anchor="middle">run · resume · usage · plan</text>
  <rect x="391" y="172" width="224" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="503" y="194.2" font-size="12" fill="#b45309" text-anchor="middle">render</text>
  <text x="503" y="212.2" font-size="12" fill="#b45309" text-anchor="middle">tables · --json output</text>

  <!-- Libraries -->
  <rect x="155" y="276" width="210" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="260" y="298.2" font-size="12" fill="#b45309" text-anchor="middle">③ config · login · secret</text>
  <text x="260" y="316.2" font-size="12" fill="#b45309" text-anchor="middle">resolve profile + login</text>
  <rect x="391" y="276" width="170" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="476" y="298.2" font-size="12" fill="#b45309" text-anchor="middle">④ pick</text>
  <text x="476" y="316.2" font-size="12" fill="#b45309" text-anchor="middle">auto: most headroom</text>

  <!-- Domain model -->
  <rect x="155" y="380" width="470" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390" y="402.2" font-size="12" fill="#6b21a8" text-anchor="middle">provider · vendor-neutral model, stdlib only</text>
  <text x="390" y="420.2" font-size="12" fill="#6b21a8" text-anchor="middle">Profile · Usage · Conversation · Command · Provider</text>

  <!-- Vendors -->
  <rect x="155" y="484" width="245" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="277.5" y="506.2" font-size="12" fill="#6b21a8" text-anchor="middle">provider/claude</text>
  <text x="277.5" y="524.2" font-size="12" fill="#6b21a8" text-anchor="middle">login · usage · history · launch</text>
  <rect x="426" y="484" width="199" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="525.5" y="506.2" font-size="12" fill="#6b21a8" text-anchor="middle">provider/codex</text>
  <text x="525.5" y="524.2" font-size="12" fill="#6b21a8" text-anchor="middle">auth · usage · rollouts</text>

  <!-- Machine -->
  <rect x="155" y="588" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="235" y="610.2" font-size="12" fill="#166534" text-anchor="middle">⑥ exec claude/codex</text>
  <text x="235" y="628.2" font-size="12" fill="#166534" text-anchor="middle">in the chosen home</text>
  <rect x="341" y="588" width="154" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="418" y="610.2" font-size="12" fill="#166534" text-anchor="middle">~/.claude* · ~/.codex</text>
  <text x="418" y="628.2" font-size="12" fill="#166534" text-anchor="middle">keychain · history</text>
  <rect x="521" y="588" width="104" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="573" y="610.2" font-size="12" fill="#166534" text-anchor="middle">usage · probe</text>
  <text x="573" y="628.2" font-size="12" fill="#166534" text-anchor="middle">HTTPS APIs</text>

  <!-- Operations -->
  <rect x="680" y="186" width="165" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="762.5" y="208.2" font-size="12" fill="#b45309" text-anchor="middle">agx doctor</text>
  <text x="762.5" y="226.2" font-size="12" fill="#b45309" text-anchor="middle">checks every home</text>
  <rect x="680" y="266" width="165" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="762.5" y="288.2" font-size="12" fill="#b45309" text-anchor="middle">agx shell-init</text>
  <text x="762.5" y="306.2" font-size="12" fill="#b45309" text-anchor="middle">zsh · bash aliases</text>
  <rect x="680" y="346" width="165" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="762.5" y="368.2" font-size="12" fill="#b45309" text-anchor="middle">agx sessions</text>
  <text x="762.5" y="386.2" font-size="12" fill="#b45309" text-anchor="middle">gc · promote · move</text>
  <rect x="680" y="426" width="165" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="762.5" y="448.2" font-size="12" fill="#9d174d" text-anchor="middle">agx login</text>
  <text x="762.5" y="466.2" font-size="12" fill="#9d174d" text-anchor="middle">~/.agx/tokens.yaml</text>

  <!-- Legend, below the body. -->
  <path d="M155,680 L 173,680" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="191" y="684" font-size="10" fill="#64748b">primary flow, numbered ①–⑥</text>
  <path d="M371,680 L 389,680" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="407" y="684" font-size="10" fill="#64748b">results returned (usage, conversations)</text>
</svg>
