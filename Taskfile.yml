version: '3'

vars:
  BIN: bin/agx
  # Every platform the README claims; `task cross` proves each one builds.
  PLATFORMS: darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64

tasks:
  build:
    desc: Build the agx binary into bin/
    cmds:
      - go build -o {{.BIN}} .

  run:
    desc: Run agx from source (pass args after --, e.g. task run -- resume --list)
    cmds:
      - go run . {{.CLI_ARGS}}

  test:
    desc: Run the full test suite with the race detector (includes the layering guard)
    cmds:
      - go test -race -count=1 ./...

  lint:
    desc: gofmt check, go vet and staticcheck
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...
      - staticcheck ./...

  cross:
    desc: Cross-compile for every supported platform (verifies platform claims)
    cmds:
      - for: { var: PLATFORMS, split: ' ' }
        cmd: GOOS={{index (splitList "/" .ITEM) 0}} GOARCH={{index (splitList "/" .ITEM) 1}} go build -o /dev/null .

  check:
    desc: Everything that must be green before a commit (lint + test + cross + build)
    cmds:
      - task: lint
      - task: test
      - task: cross
      - task: build

  docs:check:
    desc: docsync - fail when code a README sentence cites (ds:block links) changed since the sentence was acked; needs the ds CLI (go install github.com/ubgo/docsync/cli/cmd/ds@latest)
    cmds:
      - 'command -v ds >/dev/null || { echo "docs:check needs the ds CLI: go install github.com/ubgo/docsync/cli/cmd/ds@latest"; exit 1; }'
      - ds check

  docs:snippets:
    desc: Regenerate the Go source and program output quoted in docs/ and examples/ (the snip/out markers) from the real example programs
    cmds:
      - python3 scripts/docs/snippets.py --write

  docs:snippets:check:
    desc: Fail when a snippet quoted in docs/ or examples/ no longer matches its Go source or the example program's real output
    cmds:
      - python3 scripts/docs/snippets.py --check

  docs:lint:
    desc: Lint docs/ and examples/ markdown - hard-wrapped prose, broken relative links and anchors, machine-local paths, authorship wording (rules pinned by scripts/docs/test_doclint.py, run first)
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    cmds:
      - python3 -m unittest -q scripts/docs/test_doclint.py
      - python3 scripts/docs/doclint.py docs examples

  docs:all:
    desc: Every docs gate in one go - docsync (docs:check), snippet freshness (docs:snippets:check) and the markdown lint (docs:lint)
    cmds:
      - task: docs:check
      - task: docs:snippets:check
      - task: docs:lint

  install:
    desc: Install agx into $GOBIN (or ~/go/bin) so it is on PATH
    cmds:
      - go install .
